<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --g:#C5F000;--g2:#8FAF00;
  --d:#4A6CF7;--d2:#2845E0;--d3:#8BA3FF;
  --dark:#0C0D0F;--dark2:#141518;--dark3:#1C1E22;--dark4:#22252B;
  --text:#F4F2EE;--muted:#888880;--border:rgba(255,255,255,0.08);
  --r:12px;
  --font-display:'Montserrat',sans-serif;
  --font-body:'Montserrat',sans-serif;
}
body.mode-don{
  --font-display:'Nunito',sans-serif;
  --font-body:'Nunito',sans-serif;
}
html,body{height:100%;background:var(--dark);color:var(--text);font-family:var(--font-body);overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh;padding:10px;gap:8px}

/* BOARD */
#board{position:relative;flex:1;background:var(--dark2);border-radius:14px;overflow:hidden;border:1px solid var(--border);display:flex;flex-direction:column;min-height:0}

/* HEADER */
#hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 22px;background:rgba(0,0,0,0.5);border-bottom:1px solid var(--border);flex-shrink:0;z-index:20;position:relative}
#hdr-logos{display:flex;align-items:center;gap:14px;height:36px}
#hdr-logos img{height:100%;width:auto;object-fit:contain;display:block}
.logo-sep{width:1px;height:24px;background:rgba(255,255,255,0.2)}
#day-pill{font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase;padding:5px 14px;border-radius:20px;border:1px solid;transition:all .5s}
#day-pill.cross{background:rgba(197,240,0,.1);border-color:rgba(197,240,0,.35);color:var(--g)}
#day-pill.glofy{background:rgba(197,240,0,.08);border-color:rgba(197,240,0,.25);color:var(--g)}
#day-pill.don{background:rgba(74,108,247,.09);border-color:rgba(74,108,247,.3);color:var(--d3)}

/* HEADER MINI INFO BAR - visible en todos los slides excepto el splash */
#mini-bar{display:flex;align-items:center;gap:20px;font-size:12px;color:var(--muted)}
#mini-clock{font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--text);letter-spacing:-0.5px;line-height:1}
#mini-clock-sec{font-size:13px;color:var(--g);margin-left:1px}
#mini-weather{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--text)}
#mini-weather-icon{font-size:18px}

/* SLIDES */
#sv{position:relative;flex:1;overflow:hidden;min-height:0}
.slide{position:absolute;inset:0;opacity:0;transform:translateX(50px) scale(0.99);transition:opacity .6s cubic-bezier(.4,0,.2,1),transform .6s cubic-bezier(.4,0,.2,1);pointer-events:none}
.slide.active{opacity:1;transform:translateX(0) scale(1);pointer-events:all}
.slide.exit{opacity:0;transform:translateX(-50px) scale(0.99)}

/* PROGRESS */
#prog-wrap{height:3px;background:rgba(255,255,255,0.05);flex-shrink:0}
#prog-fill{height:100%;width:0%;background:var(--g);transition:width linear}
#dots{display:flex;align-items:center;justify-content:center;gap:7px;padding:7px;flex-shrink:0;background:rgba(0,0,0,.2)}
.dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.2);cursor:pointer;transition:all .3s}
.dot:hover{background:rgba(255,255,255,.45)}
.dot.on{width:22px;border-radius:3px;background:var(--g)}

/* ── S0 SPLASH — hora y clima en grande ── */
.s-splash{display:flex;height:100%;position:relative;overflow:hidden}
.splash-left{flex:1;display:flex;flex-direction:column;justify-content:center;padding:36px 40px;position:relative;z-index:1}
.splash-right{width:42%;display:flex;flex-direction:column;justify-content:center;padding:36px 36px;border-left:1px solid var(--border);position:relative;z-index:1;gap:20px}
.splash-time{font-family:var(--font-display);font-weight:900;font-size:clamp(80px,13vw,130px);letter-spacing:-4px;line-height:.9;color:var(--text)}
.splash-time-sec{font-size:clamp(40px,6vw,64px);color:var(--g);vertical-align:baseline}
.splash-time-colon{animation:blink 1s step-end infinite;color:var(--g)}
.splash-date{font-family:var(--font-display);font-weight:600;font-size:clamp(16px,2.2vw,24px);letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-top:12px}
.splash-temp{font-family:var(--font-display);font-weight:900;font-size:clamp(56px,9vw,96px);letter-spacing:-2px;line-height:1;color:var(--text)}
.splash-weather-icon{font-size:clamp(40px,6vw,64px);margin-bottom:4px}
.splash-weather-desc{font-size:clamp(14px,1.8vw,20px);color:var(--muted);text-transform:capitalize;margin-top:6px}
.splash-weather-loc{font-size:clamp(11px,1.3vw,15px);letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.25);margin-top:3px}
.splash-weather-extra{display:flex;gap:20px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.splash-we-item{display:flex;flex-direction:column;gap:3px}
.splash-we-item span{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.splash-we-item strong{font-family:var(--font-display);font-weight:700;font-size:clamp(14px,1.8vw,20px);color:var(--text)}
.splash-bg-orb{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none}
.splash-ticker{position:absolute;bottom:0;left:0;right:0;background:rgba(255,255,255,.03);border-top:1px solid var(--border);overflow:hidden;white-space:nowrap;font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);padding:10px 0}
.splash-ticker span{display:inline-block;animation:ticker 30s linear infinite}
@keyframes ticker{0%{transform:translateX(100vw)}100%{transform:translateX(-200%)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* ── S-TRENDS SLIDE ── */
.s-trends{display:flex;height:100%;position:relative;overflow:hidden}
.trends-left{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 36px;position:relative;z-index:1}
.trends-right{width:36%;background:rgba(0,0,0,.25);border-left:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;padding:28px 24px;gap:12px;position:relative;z-index:1}
.trends-tag{font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--g);margin-bottom:8px}
.trends-h1{font-family:var(--font-display);font-weight:900;font-size:clamp(36px,5vw,54px);line-height:1.02;margin-bottom:8px}
.trends-updated{font-size:12px;color:var(--muted);margin-bottom:20px}
.trends-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.trends-row:last-child{border-bottom:none}
.trends-num{font-family:var(--font-display);font-weight:800;font-size:13px;color:var(--muted);min-width:18px;text-align:right}
.trends-name{font-size:clamp(14px,1.8vw,18px);font-weight:600;flex:1;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trends-bar-wrap{width:100px;height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;flex-shrink:0}
.trends-bar{height:100%;border-radius:3px;transition:width 1.4s cubic-bezier(.4,0,.2,1)}
.trends-vol{font-family:var(--font-display);font-weight:700;font-size:13px;min-width:44px;text-align:right}
.trends-side-item{display:flex;align-items:center;gap:10px}
.trends-side-num{font-family:var(--font-display);font-weight:800;font-size:13px;color:var(--muted);min-width:18px}
.trends-side-name{font-size:13px;font-weight:600;flex:1;color:rgba(244,242,238,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trends-side-vol{font-size:11px;font-weight:700}

/* ── S-NEWS ── */
.s-news{display:grid;grid-template-columns:1fr 1fr;height:100%}
.s-news-main{padding:36px 40px;display:flex;flex-direction:column;justify-content:center;border-right:1px solid rgba(197,240,0,.12)}
.s-news-side{background:linear-gradient(135deg,rgba(197,240,0,.07) 0%,rgba(197,240,0,.02) 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 44px;gap:24px;position:relative;overflow:hidden}
.side-icon{width:100px;height:100px;border-radius:50%;background:rgba(197,240,0,.12);border:2px solid rgba(197,240,0,.3);display:flex;align-items:center;justify-content:center;font-size:48px}

/* ── S-CHECKLIST ── */
.s-check{display:flex;height:100%;position:relative}
.s-check-left{width:40%;background:rgba(0,0,0,.3);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;gap:10px}
.s-check-right{flex:1;padding:32px 36px;display:flex;flex-direction:column;justify-content:center}
.check-num{font-family:var(--font-display);font-weight:900;font-size:120px;line-height:1;color:rgba(255,255,255,.04);position:absolute;top:16px;right:24px}

/* ── S-HIRE ── */
.s-hire{display:grid;grid-template-columns:1fr 1fr;height:100%;position:relative;overflow:hidden}
.hire-bg-text{position:absolute;bottom:-20px;right:-20px;font-family:var(--font-display);font-weight:900;font-size:clamp(100px,18vw,180px);line-height:1;letter-spacing:-4px;color:rgba(197,240,0,.05);pointer-events:none;white-space:nowrap}
.hire-content{padding:36px 40px 32px;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:1;border-right:1px solid rgba(197,240,0,.1)}
.scale-badge{display:inline-flex;align-items:center;background:var(--g);color:#111;font-family:var(--font-display);font-weight:900;font-size:inherit;letter-spacing:1px;padding:0 18px;border-radius:8px;line-height:1.15}
.hire-stat{background:rgba(197,240,0,.08);border:1px solid rgba(197,240,0,.18);border-radius:10px;padding:14px 18px}
.hire-stat-num{font-family:var(--font-display);font-weight:800;font-size:28px;color:var(--g);line-height:1}
.hire-stat-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-top:3px}

/* ── S-DON ── */
.s-don{display:flex;flex-direction:column;height:100%;position:relative;overflow:hidden}
.don-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 80% 20%,rgba(74,108,247,.18) 0%,transparent 60%),radial-gradient(ellipse at 20% 80%,rgba(40,69,224,.12) 0%,transparent 50%);pointer-events:none}
.don-content{padding:36px 36px 32px;flex:1;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:1}
.don-pill{display:inline-flex;align-items:center;gap:8px;background:rgba(74,108,247,.15);border:1px solid rgba(74,108,247,.3);border-radius:20px;padding:7px 16px;font-size:13px;letter-spacing:2px;text-transform:uppercase;font-family:var(--font-display);font-weight:700;color:var(--d3);margin-bottom:18px}
.don-feature{display:flex;align-items:center;gap:14px;background:rgba(74,108,247,.07);border:1px solid rgba(74,108,247,.15);border-radius:10px;padding:14px 18px;margin-bottom:10px}
.don-feature-icon{width:40px;height:40px;border-radius:8px;background:rgba(74,108,247,.2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.don-feature h4{font-family:var(--font-display);font-weight:700;font-size:clamp(15px,1.8vw,18px);margin-bottom:3px}
.don-feature p{font-size:clamp(12px,1.4vw,14px);color:var(--muted)}

/* ── S-ADMIN ── */
.s-admin{display:flex;flex-direction:column;height:100%;padding:28px 32px 24px;position:relative}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;margin-top:12px}
.admin-card{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.admin-card-img{width:100%;height:140px;object-fit:cover;display:block}
.admin-card-body{padding:14px 18px;flex:1}
.admin-card-body h4{font-family:var(--font-display);font-weight:700;font-size:clamp(16px,2vw,20px);margin-bottom:5px}
.admin-card-body p{font-size:clamp(12px,1.4vw,14px);color:var(--muted);line-height:1.6}
.admin-card.person{border-top:3px solid var(--g)}
.admin-card.company{border-top:3px solid var(--d3)}
.admin-card.world{border-top:3px solid #FFB432}
.admin-single{position:relative;border-radius:12px;overflow:hidden;flex:1;display:flex;align-items:flex-end}
.admin-single-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.admin-single-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85) 0%,rgba(0,0,0,.4) 45%,rgba(0,0,0,.05) 100%)}
.admin-single-body{position:relative;z-index:2;padding:32px 36px;width:100%}
.admin-single-body h4{font-family:var(--font-display);font-weight:900;font-size:clamp(34px,5vw,60px);line-height:1;margin-bottom:10px;text-shadow:0 2px 20px rgba(0,0,0,.5)}
.admin-single-body p{font-size:clamp(15px,1.8vw,18px);color:rgba(244,242,238,.82);line-height:1.6;max-width:640px;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.admin-type-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.admin-type-dot.person{background:var(--g)}
.admin-type-dot.company{background:var(--d3)}
.admin-type-dot.world{background:#FFB432}

/* SHARED */
.tag{font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px}
.tag.g{color:var(--g)}.tag.d{color:var(--d3)}.tag.w{color:#FFB432}.tag.m{color:var(--muted)}
.h1{font-family:var(--font-display);font-weight:900;font-size:clamp(32px,4.5vw,52px);line-height:1.03;margin-bottom:14px}
.body-text{font-size:clamp(14px,1.6vw,16px);color:rgba(244,242,238,.72);line-height:1.7}
.check-row{display:flex;align-items:center;gap:16px;padding:13px 18px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;font-size:clamp(15px,1.8vw,18px);transition:border-color .3s}
.check-row:hover{border-color:rgba(197,240,0,.25)}
.ck{width:26px;height:26px;min-width:26px;border-radius:50%;background:rgba(197,240,0,.12);border:1.5px solid var(--g);display:flex;align-items:center;justify-content:center}
.news-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:var(--r);padding:18px 22px;margin-bottom:12px}
.news-card.hi{border-color:rgba(197,240,0,.22);background:rgba(197,240,0,.04)}
.news-card.hi h3{color:var(--g)}
.news-card h3{font-family:var(--font-display);font-weight:700;font-size:clamp(16px,2vw,20px);margin-bottom:7px}
.news-card p{font-size:clamp(13px,1.5vw,15px);color:rgba(242,240,236,.68);line-height:1.65}

/* ADMIN PANEL */
#admin-btn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:var(--r);padding:9px 15px;cursor:pointer;font-size:12px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;font-family:var(--font-body);width:100%;transition:all .2s}
#admin-btn:hover{background:rgba(255,255,255,.08);color:var(--text)}
#admin-btn svg{width:14px;height:14px}
#admin-btn .caret{margin-left:auto;transition:transform .3s}
#admin-btn.open .caret{transform:rotate(180deg)}
#admin-panel{display:none;background:var(--dark2);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;overflow-y:auto;max-height:55vh}
#admin-panel.open{display:block}

/* GitHub token section */
.token-section{background:rgba(197,240,0,.04);border:1px solid rgba(197,240,0,.15);border-radius:8px;padding:12px 14px;margin-bottom:16px}
.token-status{font-size:11px;color:var(--muted);margin-top:6px}
.token-status.ok{color:var(--g)}
.token-status.err{color:#FF6B6B}

.ap-h{font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.fg label{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.fg input,.fg select,.fg textarea{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:7px;padding:9px 11px;color:var(--text);font-size:13px;font-family:var(--font-body);outline:none;transition:border-color .2s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:rgba(197,240,0,.4)}
.fg select option{background:var(--dark2)}
.fg textarea{resize:vertical;min-height:52px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.span2{grid-column:1/-1}
.photo-drop{border:1.5px dashed rgba(255,255,255,.13);border-radius:var(--r);padding:14px;text-align:center;cursor:pointer;transition:all .2s;background:rgba(255,255,255,.02)}
.photo-drop:hover,.photo-drop.drag{border-color:var(--g);background:rgba(197,240,0,.04)}
.photo-drop p{font-size:11px;color:var(--muted);margin-top:5px}
#pf{display:none}
.ph-preview{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ph-thumb{position:relative;width:66px;height:66px;border-radius:7px;overflow:hidden;border:1px solid var(--border)}
.ph-thumb img{width:100%;height:100%;object-fit:cover}
.ph-del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.75);border:none;color:#fff;border-radius:50%;width:16px;height:16px;font-size:9px;cursor:pointer}
.btn-pub{background:var(--g);color:#111;border:none;border-radius:7px;padding:10px 16px;font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:opacity .2s;width:100%;margin-top:6px}
.btn-pub:hover{opacity:.87}
.btn-pub:disabled{opacity:.4;cursor:not-allowed}
.upload-status{font-size:11px;color:var(--g);text-align:center;margin-top:6px;min-height:16px}
#pub-list{display:flex;flex-direction:column;gap:6px;max-height:160px;overflow-y:auto;margin-top:8px}
.pi{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.04);border-radius:7px;padding:8px 10px}
.pi-pill{padding:2px 8px;border-radius:10px;font-size:9px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
.pi-pill.person{background:rgba(197,240,0,.14);color:var(--g)}
.pi-pill.company{background:rgba(74,108,247,.14);color:var(--d3)}
.pi-pill.world{background:rgba(255,180,50,.14);color:#FFB432}
.pi-txt{flex:1;font-size:12px;color:rgba(244,242,238,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi-img{font-size:10px;background:rgba(255,255,255,.07);border-radius:4px;padding:2px 5px;color:var(--muted)}
.btn-del{background:none;border:none;color:rgba(255,255,255,.2);cursor:pointer;font-size:14px;padding:0 2px}
.btn-del:hover{color:#e74c3c}
.empty-pi{font-size:11px;color:var(--muted);text-align:center;padding:12px}

::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}

.hire-right{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;position:relative;z-index:1;gap:24px}
.hire-flags{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:380px}
.hire-flag{display:inline-flex;align-items:center;gap:6px;background:rgba(197,240,0,.07);border:1px solid rgba(197,240,0,.18);border-radius:20px;padding:6px 14px;font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--text);letter-spacing:.5px;transition:all .25s;cursor:default}
.hire-flag:hover{background:rgba(197,240,0,.14);border-color:rgba(197,240,0,.4);transform:translateY(-1px)}
.hire-flag .fi{font-size:16px}
.globe-wrap{position:relative;width:clamp(200px,28vw,320px);height:clamp(200px,28vw,320px);flex-shrink:0}
@keyframes globe-float{0%,100%{transform:translateY(0px)}50%{transform:translateY(-8px)}} @keyframes dot-pulse{0%,100%{opacity:.4;r:3}50%{opacity:1;r:4.5}}
</style>
</head>

<script>
// ── CONSTANTS ──
const DAYS   = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const SLIDE_DUR = 30000;
const REPO = 'comms-glofy/cartelera';
const TRENDS_URL = 'https://raw.githubusercontent.com/' + REPO + '/main/trends.json';
const BRANCH = 'main';
const CG = ['#C5F000','#A8D000','#8FAF00','#769200','#5E7400','#475800'];
const CD = ['#8BA3FF','#7A94FF','#6882F5','#5670E0','#445EC8','#324DB0'];

// ── STATE ──
let pubs = [];
let pending = [];  // {dataURL, name, githubURL?}
let slides = [];

// ── GITHUB TOKEN ──
function getToken(){ return localStorage.getItem('gh_token') || ''; }
function saveToken(){
  const t = document.getElementById('gh-token').value.trim();
  localStorage.setItem('gh_token', t);
  updateTokenStatus();
}
function updateTokenStatus(){
  const t = getToken();
  const el = document.getElementById('token-status');
  if(t && t.startsWith('ghp_')){
    el.textContent = '✓ Token configurado — las fotos se subirán a GitHub y persistirán';
    el.className = 'token-status ok';
  } else if(t) {
    el.textContent = '⚠ Token guardado pero formato inusual — verificá que empiece con ghp_';
    el.className = 'token-status err';
  } else {
    el.textContent = 'Sin token — las fotos se guardan solo en memoria (se pierden al recargar)';
    el.className = 'token-status';
  }
}

// ── GITHUB UPLOAD ──
async function uploadToGitHub(dataURL, filename){
  const token = getToken();
  if(!token) return null;
  try {
    const base64 = dataURL.split(',')[1];
    const path = 'uploads/' + Date.now() + '_' + filename.replace(/[^a-zA-Z0-9._-]/g,'_');
    const url = `https://api.github.com/repos/${REPO}/contents/${path}`;
    const res = await fetch(url, {
      method: 'PUT',
      headers: {
        'Authorization': 'token ' + token,
        'Content-Type': 'application/json',
        'Accept': 'application/vnd.github.v3+json'
      },
      body: JSON.stringify({
        message: 'upload: ' + path,
        content: base64,
        branch: BRANCH
      })
    });
    if(!res.ok){
      const err = await res.json();
      console.error('GitHub upload error:', err);
      return null;
    }
    const data = await res.json();
    return data.content.download_url;
  } catch(e){
    console.error('GitHub upload failed:', e);
    return null;
  }
}

// ── MODE ──
function getMode(){
  const d = new Date().getDay();
  if(d===1) return 'cross';
  if(d===2) return 'don';
  if(d===3||d===4) return 'glofy';
  if(d===5) return 'don';
  return 'cross';
}
function applyMode(){
  const m = getMode();
  document.body.className = 'mode-' + m;
  const lg = document.getElementById('logo-glofy-img');
  const ld = document.getElementById('logo-don-img');
  const ls = document.getElementById('logo-sep');
  const pill = document.getElementById('day-pill');
  if(m==='cross'){lg.style.display='block';ld.style.display='block';ls.style.display='block';pill.textContent='CROSS — Glofy · Don';pill.className='cross';}
  else if(m==='glofy'){lg.style.display='block';ld.style.display='none';ls.style.display='none';pill.textContent='GLOFY';pill.className='glofy';}
  else{lg.style.display='none';ld.style.display='block';ls.style.display='none';pill.textContent='DON GESTIÓN';pill.className='don';}
}

function buildTrendsHTML(m){
  const colors = m==='don'?CD:CG;
  const trends = trendsCache.trends.slice(0,6);
  if(!trends.length) return `<div class="s-trends"><div style="display:flex;align-items:center;justify-content:center;width:100%;font-size:18px;color:var(--muted)">Cargando tendencias…</div></div>`;

  const updated = trendsCache.updated
    ? new Date(trendsCache.updated).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',timeZone:'America/Argentina/Buenos_Aires'})
    : '--:--';

  const rows = trends.map((t,i)=>{
    const w = 100 - i*12;
    const name = t.name.replace(/\b\w/g,c=>c.toUpperCase());
    return `<div class="trends-row">
      <div class="trends-num">${i+1}</div>
      <div class="trends-name" title="${name}">${name}</div>
      <div class="trends-bar-wrap"><div class="trends-bar" style="width:0%;background:${colors[i]||colors[0]}" data-w="${w}"></div></div>
      <div class="trends-vol" style="color:${colors[i]||colors[0]}">${t.traffic||''}</div>
    </div>`;
  }).join('');

  const sideItems = trends.map((t,i)=>{
    const name = t.name.replace(/\b\w/g,c=>c.toUpperCase());
    return `<div class="trends-side-item">
      <div class="trends-side-num">${i+1}</div>
      <div class="trends-side-name">${name}</div>
      <div class="trends-side-vol" style="color:${colors[i]||colors[0]}">${t.traffic||''}</div>
    </div>`;
  }).join('');

  return `<div class="s-trends">
    <div style="position:absolute;top:-40px;right:36%;width:300px;height:300px;background:${m==='don'?'#4A6CF7':'#C5F000'};opacity:.04;border-radius:50%;filter:blur(80px);pointer-events:none"></div>
    <div class="trends-left">
      <div class="trends-tag">🔥 En tendencia ahora</div>
      <div class="trends-h1">Google Trends<br><span style="color:${m==='don'?'var(--d3)':'var(--g)'};font-size:0.8em">Argentina</span></div>
      <div class="trends-updated"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${m==='don'?'var(--d3)':'var(--g)'};margin-right:6px;animation:blink 1.5s ease-in-out infinite;vertical-align:middle"></span>Actualizado a las ${updated} · Fuente: Google</div>
      ${rows}
    </div>
    <div class="trends-right" style="border-left:1px solid var(--border)">
      <div style="font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:12px">Top búsquedas</div>
      ${sideItems}
    </div>
  </div>`;
}

function buildPubSlides(m){
  const filtered = pubs.filter(p=>p.aud==='all'||p.aud===m);
  if(!filtered.length) return [];
  const result=[];
  for(let i=0;i<filtered.length;){
    const group = filtered.slice(i,i+2);
    const isHero = group.length===1&&group[0].photos.length>0;
    const icons={person:'👤',company:'🏢',world:'⚽'};
    const acColor={person:'var(--g)',company:'var(--d3)',world:'#FFB432'};
    const tagCls={person:'g',company:'d',world:'w'};

    if(isHero){
      const p=group[0];
      result.push({html:`
        <div style="display:flex;flex-direction:column;height:100%;padding:20px 24px 16px;gap:10px">
          <div class="tag ${tagCls[p.type]}" style="color:${acColor[p.type]}"><span class="admin-type-dot ${p.type}"></span>Novedades</div>
          <div class="admin-single" style="border-top:3px solid ${acColor[p.type]}">
            ${p.photos[0]?`<img class="admin-single-img" src="${p.photos[0]}" alt=""><div class="admin-single-overlay"></div>`:''}
            <div class="admin-single-body">
              <h4>${esc(p.title)}</h4>
              ${p.body?`<p>${esc(p.body)}</p>`:''}
            </div>
          </div>
        </div>`});
    } else {
      const cardsHtml = group.map(p=>`
        <div class="admin-card ${p.type}">
          ${p.photos[0]?`<img class="admin-card-img" src="${p.photos[0]}" alt="">`:`<div style="height:90px;background:rgba(${p.type==='world'?'255,180,50':p.type==='company'?'74,108,247':'197,240,0'},.06);display:flex;align-items:center;justify-content:center;font-size:44px">${icons[p.type]}</div>`}
          <div class="admin-card-body"><h4>${esc(p.title)}</h4>${p.body?`<p>${esc(p.body)}</p>`:''}</div>
        </div>`).join('');
      result.push({html:`
        <div class="s-admin">
          <div class="tag g">Novedades</div>
          <div class="h1" style="font-size:clamp(28px,4vw,42px);margin-bottom:0">Lo que está pasando</div>
          <div class="admin-grid">${cardsHtml}</div>
        </div>`});
    }
    i+=group.length;
  }
  return result;
}

function rebuild(){
  const m=getMode();
  const base = buildBase(m);
  // Replace trends placeholder with live html
  base.forEach(s=>{ if(s.type==='trends') s.html = buildTrendsHTML(m); });
  slides=[...base,...buildPubSlides(m)];
  const sc=document.getElementById('sc');
  const dotsEl=document.getElementById('dots');
  sc.innerHTML='';dotsEl.innerHTML='';
  slides.forEach((s,i)=>{
    const div=document.createElement('div');
    div.className='slide'+(i===0?' active':'');
    div.innerHTML=s.html;
    sc.appendChild(div);
    const dot=document.createElement('div');
    dot.className='dot'+(i===0?' on':'');
    dot.onclick=()=>goTo(i);
    dotsEl.appendChild(dot);
  });
  cur=0;
  startAuto();
  // Animate trend bars after render
  setTimeout(animateTrendBars, 200);
  // Update splash clock
  updateSplashClock();
  // Fill weather in splash
  fillSplashWeather();
}

function animateTrendBars(){
  document.querySelectorAll('.trends-bar').forEach(b=>{ b.style.width=b.dataset.w+'%'; });
}

// ── NAVIGATION ──
function goTo(n){
  const all=document.querySelectorAll('.slide');
  const allD=document.querySelectorAll('.dot');
  if(!all[cur]) return;
  all[cur].classList.add('exit');
  const prev=cur;
  setTimeout(()=>all[prev]?.classList.remove('active','exit'),620);
  cur=((n%slides.length)+slides.length)%slides.length;
  all[cur].classList.add('active');
  allD.forEach((d,i)=>d.classList.toggle('on',i===cur));
  // Animate bars when trends slide becomes active
  setTimeout(animateTrendBars,100);
}
function next(){goTo(cur+1)}
function startAuto(){
  clearInterval(stimer);
  const fill=document.getElementById('prog-fill');
  const reset=()=>{fill.style.transition='none';fill.style.width='0%';void fill.offsetWidth;fill.style.transition=`width ${SLIDE_DUR}ms linear`;fill.style.width='100%'};
  reset();
  stimer=setInterval(()=>{next();reset();},SLIDE_DUR);
}

// ── CLOCK ──
function updateClock(){
  const n=new Date();
  const h=String(n.getHours()).padStart(2,'0');
  const mi=String(n.getMinutes()).padStart(2,'0');
  const s=String(n.getSeconds()).padStart(2,'0');
  // Mini bar
  document.getElementById('mini-clock').innerHTML=`${h}<span style="animation:blink 1s step-end infinite;color:var(--g)">:</span>${mi}<span id="mini-sec" style="font-size:13px;color:var(--g)">:${s}</span>`;
  updateSplashClock();
}
function updateSplashClock(){
  const n=new Date();
  const h=String(n.getHours()).padStart(2,'0');
  const mi=String(n.getMinutes()).padStart(2,'0');
  const s=String(n.getSeconds()).padStart(2,'0');
  const hm=document.getElementById('splash-hm');
  const sec=document.getElementById('splash-sec');
  const date=document.getElementById('splash-date');
  if(hm) hm.innerHTML=`${h}<span class="splash-time-colon">:</span>${mi}<span class="splash-time-sec" id="splash-sec">:${s}</span>`;
  if(date) date.textContent=`${DAYS[n.getDay()]} ${n.getDate()} de ${MONTHS[n.getMonth()]}`;
}

// ── WEATHER ──
async function fetchWeather(){
  try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=-32.9442&longitude=-60.6505&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&wind_speed_unit=kmh&timezone=America%2FArgentina%2FBuenos_Aires');
    const d=await r.json();const c=d.current;
    const{desc,icon}=wmo(c.weather_code);
    weatherCache={
      temp:Math.round(c.temperature_2m)+'°C',
      desc,icon,
      hum:c.relative_humidity_2m+'%',
      wind:Math.round(c.wind_speed_10m)+' km/h',
      feels:Math.round(c.apparent_temperature)+'°'
    };
    fillSplashWeather();
    // Mini bar
    document.getElementById('mini-temp').textContent=weatherCache.temp;
    document.getElementById('mini-weather-icon').textContent=weatherCache.icon;
    document.getElementById('mini-desc').textContent=desc;
  }catch(_){}
}
function fillSplashWeather(){
  const el = id => document.getElementById(id);
  if(el('splash-temp')) el('splash-temp').textContent = weatherCache.temp;
  if(el('splash-desc')) el('splash-desc').textContent = weatherCache.desc;
  if(el('splash-icon')) el('splash-icon').textContent = weatherCache.icon;
  if(el('splash-hum'))  el('splash-hum').textContent  = weatherCache.hum;
  if(el('splash-wind')) el('splash-wind').textContent = weatherCache.wind;
  if(el('splash-feels'))el('splash-feels').textContent= weatherCache.feels;
}
function wmo(c){
  if(c===0)return{desc:'Cielo despejado',icon:'☀️'};
  if(c<=2)return{desc:'Parcialmente nublado',icon:'⛅'};
  if(c===3)return{desc:'Nublado',icon:'☁️'};
  if(c<=49)return{desc:'Neblina',icon:'🌫'};
  if(c<=57)return{desc:'Llovizna',icon:'🌦'};
  if(c<=67)return{desc:'Lluvia',icon:'🌧'};
  if(c<=77)return{desc:'Nieve',icon:'❄️'};
  if(c<=82)return{desc:'Chubascos',icon:'🌧'};
  return{desc:'Tormenta',icon:'⛈'};
}

// ── TRENDS ──
async function fetchTrends(){
  try{
    const res = await fetch(TRENDS_URL+'?t='+Date.now());
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    if(data.trends && data.trends.length){
      trendsCache = data;
      // Rebuild only the trends slide in-place without full rebuild
      refreshTrendsSlide();
    }
  }catch(e){
    console.warn('Trends fetch failed:', e.message);
  }
}
function refreshTrendsSlide(){
  const m = getMode();
  // Find trends slide index
  const idx = slides.findIndex(s=>s.type==='trends');
  if(idx<0) return;
  slides[idx].html = buildTrendsHTML(m);
  const allSlides = document.querySelectorAll('.slide');
  if(allSlides[idx]) allSlides[idx].innerHTML = slides[idx].html;
  setTimeout(animateTrendBars, 100);
}

// ── PHOTOS ──
function handleFiles(files){
  const f = files[0];
  if(!f||!f.type.startsWith('image/'))return;
  if(f.size>5*1024*1024){alert('Archivo muy grande (máx 5 MB)');return;}
  const r=new FileReader();
  r.onload=e=>{ pending=[{dataURL:e.target.result,name:f.name,githubURL:null}]; renderPrev(); };
  r.readAsDataURL(f);
}
function doDrop(e){e.preventDefault();document.getElementById('ph-drop').classList.remove('drag');handleFiles(e.dataTransfer.files);}
function renderPrev(){
  document.getElementById('ph-preview').innerHTML=pending.map((p,i)=>`
    <div class="ph-thumb"><img src="${p.dataURL}"><button class="ph-del" onclick="rmPh(${i})">✕</button></div>`).join('');
}
function rmPh(i){pending.splice(i,1);renderPrev();}

// ── POSTS GITHUB PERSISTENCE ──
const POSTS_URL = 'https://raw.githubusercontent.com/' + REPO + '/main/posts.json';

async function savePosts(){
  const token = getToken();
  if(!token) return false;
  try {
    // Get current SHA of posts.json (needed for update)
    const shaRes = await fetch(`https://api.github.com/repos/${REPO}/contents/posts.json`, {
      headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json' }
    });
    let sha = null;
    if(shaRes.ok){ const d = await shaRes.json(); sha = d.sha; }

    const content = btoa(unescape(encodeURIComponent(JSON.stringify(pubs, null, 2))));
    const body = { message: 'posts: actualizar cartelera', content, branch: BRANCH };
    if(sha) body.sha = sha;

    const res = await fetch(`https://api.github.com/repos/${REPO}/contents/posts.json`, {
      method: 'PUT',
      headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' },
      body: JSON.stringify(body)
    });
    return res.ok;
  } catch(e) {
    console.error('savePosts failed:', e);
    return false;
  }
}

async function loadPosts(){
  try {
    const res = await fetch(POSTS_URL + '?t=' + Date.now());
    if(!res.ok) return; // posts.json no existe todavía — ok
    const data = await res.json();
    if(Array.isArray(data) && data.length){
      pubs = data;
      renderPubList();
      rebuild();
    }
  } catch(e) {
    console.warn('loadPosts failed:', e.message);
  }
}

// ── PUBLISH ──
async function publish(){
  const t=document.getElementById('f-title').value.trim();
  if(!t){document.getElementById('f-title').focus();return;}
  const btn = document.getElementById('btn-publish');
  const status = document.getElementById('upload-status');
  btn.disabled=true;

  const token = getToken();

  // 1. Subir foto si hay
  let photoURL = null;
  if(pending.length>0){
    if(token){
      status.textContent = '⏳ Subiendo foto a GitHub…';
      photoURL = await uploadToGitHub(pending[0].dataURL, pending[0].name);
      if(photoURL){
        status.textContent = '⏳ Foto subida — guardando publicación…';
      } else {
        status.textContent = '⚠ No se pudo subir la foto — publicando sin foto';
      }
    } else {
      photoURL = pending[0].dataURL;
    }
  }

  // 2. Agregar publicación
  pubs.push({
    id: Date.now(),
    type: document.getElementById('f-type').value,
    aud:  document.getElementById('f-aud').value,
    title: t,
    body:  document.getElementById('f-body').value.trim(),
    photos: photoURL ? [photoURL] : [],
    createdAt: new Date().toISOString(),
  });

  // 3. Guardar en GitHub si hay token
  if(token){
    status.textContent = '⏳ Guardando en GitHub…';
    const saved = await savePosts();
    if(saved){
      status.textContent = '✓ Publicación guardada en GitHub — persiste al recargar';
    } else {
      status.textContent = '⚠ No se pudo guardar en GitHub — solo en memoria';
    }
  } else {
    status.textContent = '⚠ Sin token — la publicación se perderá al recargar';
  }

  document.getElementById('f-title').value='';
  document.getElementById('f-body').value='';
  pending=[];renderPrev();
  btn.disabled=false;
  renderPubList();rebuild();
}

async function delPub(id){
  pubs = pubs.filter(p=>p.id!==id);
  renderPubList();
  rebuild();
  // Guardar cambio en GitHub
  const token = getToken();
  if(token){
    const status = document.getElementById('upload-status');
    status.textContent = '⏳ Eliminando de GitHub…';
    const saved = await savePosts();
    status.textContent = saved ? '✓ Eliminado de GitHub' : '⚠ Error al eliminar de GitHub';
    setTimeout(()=>{ status.textContent=''; }, 3000);
  }
}

function renderPubList(){
  const el=document.getElementById('pub-list');
  if(!pubs.length){el.innerHTML='<div class="empty-pi">Sin publicaciones activas</div>';return;}
  const icons={person:'👤',company:'🏢',world:'⚽'};
  const al={all:'Todos',cross:'Cross',glofy:'Glofy',don:'Don'};
  el.innerHTML=pubs.map(p=>`
    <div class="pi">
      <span class="pi-pill ${p.type}">${icons[p.type]} ${al[p.aud]||p.aud}</span>
      <span class="pi-txt">${esc(p.title)}</span>
      ${p.photos.length?`<span class="pi-img">${p.photos[0].startsWith('http')?'☁️':'📷'}</span>`:''}
      <button class="btn-del" onclick="delPub(${p.id})">✕</button>
    </div>`).join('');
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

document.addEventListener('keydown',e=>{
