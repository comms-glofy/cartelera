name: Actualizar Tendencias

on:
  schedule:
    - cron: '*/30 * * * *'   # cada 30 minutos
  workflow_dispatch:            # también se puede correr manualmente

jobs:
  scrape-trends:
    runs-on: ubuntu-latest
    permissions:
      contents: write           # necesario para hacer commit

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Instalar dependencias Python
        run: pip install requests beautifulsoup4 lxml

      - name: Scrapear trends24.in/argentina
        run: python3 .github/workflows/scrape_trends.py

      - name: Commit trends.json si hubo cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trends.json
          git diff --cached --quiet || git commit -m "chore: actualizar tendencias $(date -u +'%H:%M UTC')"
          git push
