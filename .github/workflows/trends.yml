name: Actualizar Tendencias

on:
  schedule:
    - cron: '*/30 * * * *'   # cada 30 minutos
  workflow_dispatch:            # correr manualmente cuando quieras

jobs:
  scrape-trends:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Instalar Python y dependencias
        run: pip install requests pytrends

      - name: Obtener tendencias de Argentina
        run: python3 .github/workflows/scrape_trends.py

      - name: Guardar trends.json en el repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trends.json
          git diff --cached --quiet || git commit -m "trends: actualizar $(date -u +'%H:%M UTC')"
          git push
